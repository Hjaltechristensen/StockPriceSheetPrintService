<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portefølje Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0f1117;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            min-height: 100vh;
            padding: 2rem;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 2rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: #1e2330;
            border: 1px solid #2d3748;
            border-radius: 12px;
            padding: 1.25rem 1.5rem;
        }

            .stat-card .label {
                font-size: 0.75rem;
                color: #64748b;
                text-transform: uppercase;
                letter-spacing: 0.08em;
                margin-bottom: 0.5rem;
            }

            .stat-card .value {
                font-size: 1.6rem;
                font-weight: 700;
                color: #f1f5f9;
            }

            .stat-card .sub {
                font-size: 0.85rem;
                margin-top: 0.3rem;
            }

        .positive {
            color: #4ade80;
        }

        .negative {
            color: #f87171;
        }

        .neutral {
            color: #94a3b8;
        }

        .chart-container {
            background: #1e2330;
            border: 1px solid #2d3748;
            border-radius: 12px;
            padding: 1.5rem;
        }

        .period-buttons {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.25rem;
        }

            .period-buttons button {
                background: #2d3748;
                border: 1px solid #374151;
                color: #94a3b8;
                border-radius: 6px;
                padding: 0.35rem 0.85rem;
                font-size: 0.8rem;
                cursor: pointer;
                transition: background 0.15s, color 0.15s;
            }

                .period-buttons button:hover,
                .period-buttons button.active {
                    background: #3b82f6;
                    border-color: #3b82f6;
                    color: #fff;
                }

        canvas {
            width: 100% !important;
        }

        #error {
            display: none;
            color: #f87171;
            margin-top: 1rem;
            font-size: 0.9rem;
        }
        @media (max-width: 600px) {
            body {
                padding: 1rem;
            }

            h1 {
                font-size: 1.1rem;
                margin-bottom: 1.25rem;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.75rem;
            }

            .stat-card {
                padding: 0.9rem 1rem;
            }

                .stat-card .value {
                    font-size: 1.15rem;
                }

                .stat-card .sub {
                    font-size: 0.75rem;
                }

            .chart-container {
                padding: 1rem;
            }

            .period-buttons button {
                flex: 1;
                padding: 0.6rem 0;
                font-size: 0.85rem;
            }

            .period-badge {
                display: inline-block;
                font-size: 0.65rem;
                padding: 2px 6px;
                border-radius: 4px;
                margin-top: 0.4rem;
                font-weight: 600;
                letter-spacing: 0.05em;
                background: #1e3a5f;
                color: #60a5fa;
            }

            .chart-toolbar {
                display: flex;
                gap: 1.5rem;
                margin-bottom: 1rem;
                flex-wrap: wrap;
                align-items: center;
            }

            .toolbar-group {
                display: flex;
                align-items: center;
                gap: 0.5rem;
            }

            .toolbar-label {
                font-size: 0.75rem;
                color: #64748b;
                text-transform: uppercase;
                letter-spacing: 0.06em;
            }

            .chart-toolbar select {
                background: #2d3748;
                border: 1px solid #374151;
                color: #e2e8f0;
                border-radius: 6px;
                padding: 0.3rem 0.6rem;
                font-size: 0.8rem;
                cursor: pointer;
            }

            .toggle-btn {
                background: #2d3748;
                border: 1px solid #374151;
                color: #94a3b8;
                border-radius: 6px;
                padding: 0.3rem 0.75rem;
                font-size: 0.8rem;
                cursor: pointer;
                transition: background 0.15s, color 0.15s;
            }

                .toggle-btn.active {
                    background: #3b82f6;
                    border-color: #3b82f6;
                    color: #fff;
                }
        }
    </style>
</head>
<body>
    <h1>Portfolio Dashboard</h1>

    <div class="stats" id="statsRow1">
        <div class="stat-card">
            <div class="label">Latest total</div>
            <div class="value" id="latestValue">—</div>
            <div class="sub neutral" id="latestDate">—</div>
        </div>
        <div class="stat-card">
            <div class="label">Change (1 day)</div>
            <div class="value" id="dayChange">—</div>
            <div class="sub" id="dayChangePct">—</div>
        </div>
        <div class="stat-card">
            <div class="label">YTD change</div>
            <div class="value" id="ytdChange">—</div>
            <div class="sub" id="ytdChangePct">—</div>
        </div>
        <div class="stat-card">
            <div class="label">Total data points</div>
            <div class="value" id="dataPoints">—</div>
            <div class="sub neutral" id="dataRange">—</div>
        </div>
    </div>

    <div class="stats" id="statsRow2">
        <div class="stat-card">
            <div class="label">Change in the period</div>
            <div class="value" id="periodChange">—</div>
            <div class="sub" id="periodChangePct">—</div>
        </div>
        <div class="stat-card">
            <div class="label">Data points in the period</div>
            <div class="value" id="periodPoints">—</div>
            <div class="sub neutral" id="periodPointsSub">—</div>
        </div>
        <div class="stat-card">
            <div class="label">Best day in the period</div>
            <div class="value" id="bestDayValue">—</div>
            <div class="sub neutral" id="bestDayDate">—</div>
        </div>
        <div class="stat-card">
            <div class="label">Volatility (std. dev.)</div>
            <div class="value" id="volatility">—</div>
            <div class="sub neutral" id="volatilitySub">—</div>
        </div>
    </div>

    <div class="chart-container">
        <div class="period-buttons">
            <button data-days="7">1W</button>
            <button data-days="30">1M</button>
            <button data-days="90">3M</button>
            <button data-days="180">6M</button>
            <button data-days="365">1Y</button>
            <button data-days="ytd">YTD</button>
            <button data-days="0" class="active">All history</button>
        </div>
        <div class="chart-toolbar">
            <div class="toolbar-group">
                <span class="toolbar-label">Benchmark</span>
                <select id="benchmarkSelect">
                    <option value="msci">MSCI World (~10% p.a.)</option>
                    <option value="sp500">S&P 500 (~11% p.a.)</option>
                    <option value="omxc25">OMXC25 (~8% p.a.)</option>
                    <option value="inflation">Inflation (~2,5% p.a.)</option>
                    <option value="bonds">Obligationer (~3% p.a.)</option>
                </select>
                <button class="toggle-btn active" id="benchmarkToggle">Fra</button>
            </div>
            <div class="toolbar-group">
                <span class="toolbar-label">Trendlinje</span>
                <button class="toggle-btn active" id="trendToggle">Fra</button>
            </div>
        </div>
        <canvas id="chart"></canvas>
    </div>

    <p id="error"></p>

    <script>
        const fmt = new Intl.NumberFormat("da-DK", { style: "currency", currency: "DKK", maximumFractionDigits: 0 });
        const fmtPct = v => (v >= 0 ? "+" : "") + v.toFixed(2) + " %";
        const fmtAxis = v => {
            if (Math.abs(v) >= 1e6) return (v / 1e6).toLocaleString("da-DK", { maximumFractionDigits: 1 }) + "M";
            if (Math.abs(v) >= 1e3) return (v / 1e3).toLocaleString("da-DK", { maximumFractionDigits: 0 }) + "k";
            return v.toString();
        };

        function colorClass(v) { return v > 0 ? "positive" : v < 0 ? "negative" : "neutral"; }

        function setText(id, text, cls) {
            const el = document.getElementById(id);
            el.textContent = text;
            if (cls) { el.className = "sub " + cls; }
        }

        let allEntries = [];
        let currentDays = 0;
        let chart = null;

        const crosshairPlugin = {
            id: 'crosshair',
            afterDraw(chart) {
                if (chart._hoverY == null) return;
                const { ctx, chartArea } = chart;
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(chartArea.left, chart._hoverY);
                ctx.lineTo(chartArea.right, chart._hoverY);
                ctx.strokeStyle = 'rgba(148,163,184,0.4)';
                ctx.lineWidth = 1;
                ctx.setLineDash([4, 4]);
                ctx.stroke();
                ctx.restore();
            }
        };

        const benchmarkRates = {
            msci: 0.10,
            sp500: 0.11,
            omxc25: 0.08,
            inflation: 0.025,
            bonds: 0.03,
        };

        let showBenchmark = false;
        let showTrend = true;

        function generateBenchmark(entries, annualRate) {
            if (entries.length === 0) return [];
            const base = entries[0].value;
            const startDate = new Date(entries[0].date);
            return entries.map(e => {
                const days = (new Date(e.date) - startDate) / (1000 * 60 * 60 * 24);
                return base * Math.pow(1 + annualRate, days / 365);
            });
        }

        function generateTrend(entries) {
            const n = entries.length;
            if (n < 2) return [];
            const xs = entries.map((_, i) => i);
            const ys = entries.map(e => e.value);
            const meanX = (n - 1) / 2;
            const meanY = ys.reduce((a, b) => a + b, 0) / n;
            const num = xs.reduce((sum, x, i) => sum + (x - meanX) * (ys[i] - meanY), 0);
            const den = xs.reduce((sum, x) => sum + Math.pow(x - meanX, 2), 0);
            const slope = num / den;
            const intercept = meanY - slope * meanX;
            return xs.map(x => Math.round(slope * x + intercept));
        }

        function buildChart(entries) {
            const labels = entries.map(e => e.date);
            const values = entries.map(e => e.value);
            const benchmarkKey = document.getElementById("benchmarkSelect").value;
            const benchmarkData = benchmarkKey !== "none"
                ? generateBenchmark(entries, benchmarkRates[benchmarkKey])
                : [];
            const trendData = generateTrend(entries);

            if (chart) {
                chart.data.labels = labels;
                chart.data.datasets[0].data = values;
                chart.data.datasets[1].data = showBenchmark && benchmarkData.length ? benchmarkData : [];
                chart.data.datasets[2].data = showTrend ? trendData : [];
                chart.update();
                return;
            }

            const ctx = document.getElementById("chart").getContext("2d");
            const g = ctx.createLinearGradient(0, 0, 0, 400);
            g.addColorStop(0, "rgba(59,130,246,0.35)");
            g.addColorStop(1, "rgba(59,130,246,0)");

            chart = new Chart(ctx, {
                plugins: [crosshairPlugin],
                type: "line",
                data: {
                    labels,
                    datasets: [
                        {
                            label: "Portefølje",
                            data: values,
                            borderColor: "#3b82f6",
                            backgroundColor: g,
                            borderWidth: 2,
                            pointRadius: entries.length > 100 ? 0 : 3,
                            pointHoverRadius: 5,
                            fill: true,
                            tension: 0.3,
                            order: 1,
                        },
                        {
                            label: "Benchmark",
                            data: showBenchmark && benchmarkData.length ? benchmarkData : [],
                            borderColor: "#f59e0b",
                            backgroundColor: "transparent",
                            borderWidth: 1.5,
                            borderDash: [5, 4],
                            pointRadius: 0,
                            pointHoverRadius: 4,
                            fill: false,
                            tension: 0.3,
                            order: 2,
                        },
                        {
                            label: "Trend",
                            data: showTrend ? trendData : [],
                            borderColor: "rgba(168,85,247,0.7)",
                            backgroundColor: "transparent",
                            borderWidth: 1.5,
                            borderDash: [3, 3],
                            pointRadius: 0,
                            pointHoverRadius: 0,
                            fill: false,
                            tension: 0,
                            order: 3,
                        },
                    ]
                },
                options: {
                    onHover(evt, items, chart) {
                        if (!items.length) {
                            chart._hoverY = null;
                        } else {
                            chart._hoverY = chart.scales.y.getPixelForValue(items[0].element.$context.raw);
                        }
                    },
                    responsive: true,
                    interaction: { mode: "index", intersect: false },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: ctx => `${ctx.dataset.label}: ${fmt.format(ctx.parsed.y)}`
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { color: "#64748b", maxTicksLimit: 8 },
                            grid: { color: "#1a2233" }
                        },
                        y: {
                            ticks: {
                                color: "#64748b",
                                callback: v => fmtAxis(v)
                            },
                            grid: { color: "#1a2233" }
                        }
                    }
                }
            });

            document.getElementById("chart").addEventListener("mouseleave", () => {
                chart._hoverY = null;
                chart.update("none");
            });
        }

        function populatePeriodStats(entries, periodLabel) {
            if (entries.length === 0) return;

            const first = entries[0];
            const last = entries[entries.length - 1];

            // Ændring i perioden
            const diff = last.value - first.value;
            const pct = (diff / first.value) * 100;
            document.getElementById("periodChange").textContent = fmt.format(diff);
            document.getElementById("periodChange").className = "value " + colorClass(diff);
            const pctEl = document.getElementById("periodChangePct");
            pctEl.textContent = fmtPct(pct);
            pctEl.className = "sub " + colorClass(pct);

            // Datapunkter i periode
            document.getElementById("periodPoints").textContent = entries.length;
            document.getElementById("periodPointsSub").textContent =
                `af ${allEntries.length} total · ${periodLabel}`;

            // Bedste dag
            let bestDiff = -Infinity;
            let bestDate = "—";
            for (let i = 1; i < entries.length; i++) {
                const d = entries[i].value - entries[i - 1].value;
                if (d > bestDiff) {
                    bestDiff = d;
                    bestDate = entries[i].date;
                }
            }
            document.getElementById("bestDayValue").textContent =
                bestDiff > -Infinity ? fmt.format(bestDiff) : "—";
            document.getElementById("bestDayValue").className =
                "value " + colorClass(bestDiff);
            document.getElementById("bestDayDate").textContent = bestDate;

            // Volatilitet — standardafvigelse på daglige ændringer
            const dailyChanges = [];
            for (let i = 1; i < entries.length; i++) {
                dailyChanges.push(entries[i].value - entries[i - 1].value);
            }
            if (dailyChanges.length > 1) {
                const mean = dailyChanges.reduce((a, b) => a + b, 0) / dailyChanges.length;
                const variance = dailyChanges.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / dailyChanges.length;
                const stdDev = Math.sqrt(variance);
                document.getElementById("volatility").textContent = "±" + fmt.format(Math.round(stdDev));
                document.getElementById("volatilitySub").textContent = "per day in the period";
            } else {
                document.getElementById("volatility").textContent = "—";
                document.getElementById("volatilitySub").textContent = "not enough data";
            }
        }

        function filterAndRender(days) {
            currentDays = days;
            let entries = allEntries;
            let periodLabel = "All history";

            if (days === "ytd") {
                const ytdStart = `${new Date().getFullYear()}-01-01`;
                entries = allEntries.filter(e => e.date >= ytdStart);
                periodLabel = "Year to date";
            } else if (days > 0) {
                const cutoff = new Date();
                cutoff.setDate(cutoff.getDate() - days);
                const cutoffStr = cutoff.toISOString().slice(0, 10);
                entries = allEntries.filter(e => e.date >= cutoffStr);
                const labels = { 7: "1 Week", 30: "1 Month", 90: "3 Months", 180: "6 Months", 365: "1 Year" };
                periodLabel = labels[days] ?? `${days}d`;
            }

            buildChart(entries);
            populatePeriodStats(entries, periodLabel);
        }


        function populateStats(entries) {
            if (entries.length === 0) return;

            const latest = entries[entries.length - 1];
            const prev = entries.length >= 2 ? entries[entries.length - 2] : null;

            setText("latestValue", fmt.format(latest.value));
            setText("latestDate", latest.date, "neutral");

            if (prev) {
                const diff = latest.value - prev.value;
                const pct = (diff / prev.value) * 100;
                document.getElementById("dayChange").textContent = fmt.format(diff);
                document.getElementById("dayChange").className = "value " + colorClass(diff);
                setText("dayChangePct", fmtPct(pct), colorClass(pct));
            }

            const now = new Date();
            const ytdStart = `${now.getFullYear()}-01-01`;
            const firstOfYear = entries.find(e => e.date >= ytdStart);
            if (firstOfYear) {
                const ytdDiff = latest.value - firstOfYear.value;
                const ytdPct = (ytdDiff / firstOfYear.value) * 100;
                document.getElementById("ytdChange").textContent = fmt.format(ytdDiff);
                document.getElementById("ytdChange").className = "value " + colorClass(ytdDiff);
                setText("ytdChangePct", fmtPct(ytdPct), colorClass(ytdPct));
            }

            setText("dataPoints", entries.length.toString());
            setText("dataRange", entries[0].date + " → " + latest.date, "neutral");
        }

        async function init() {
            try {
                const res = await fetch("/dashboard/data");
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                allEntries = await res.json();
                populateStats(allEntries);
                filterAndRender(0);
            } catch (e) {
                const el = document.getElementById("error");
                el.textContent = "Kunne ikke hente data: " + e.message;
                el.style.display = "block";
            }
        }

        document.querySelectorAll(".period-buttons button").forEach(btn => {
            btn.addEventListener("click", () => {
                document.querySelectorAll(".period-buttons button").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                filterAndRender(btn.dataset.days === "ytd" ? "ytd" : parseInt(btn.dataset.days, 10));
            });
        });

        document.getElementById("benchmarkToggle").addEventListener("click", function () {
            showBenchmark = !showBenchmark;
            this.textContent = showBenchmark ? "Til" : "Fra";
            this.classList.toggle("active", showBenchmark);
            filterAndRender(currentDays);
        });

        document.getElementById("trendToggle").addEventListener("click", function () {
            showTrend = !showTrend;
            this.textContent = showTrend ? "Til" : "Fra";
            this.classList.toggle("active", showTrend);
            filterAndRender(currentDays);
        });

        document.getElementById("benchmarkSelect").addEventListener("change", () => {
            filterAndRender(currentDays);
        });

        init();
    </script>
</body>
</html>
